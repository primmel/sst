name: ci

# The SST framework CI (TODO.FULL/07) — ported from the archived
# sim-instruments monorepo CI, adjusted for the split. Every job checks
# the three sibling repos into x/primmel/sst, x/primmel/primmel-ts, and
# (where instruments boot) x/oimlsmart/sst-instruments — the layout the
# file: dependencies in package.json traverse, entirely inside the
# workspace (no symlinks, no escapes).

on:
  push: { branches: [v2] }
  pull_request: {}
  schedule: [cron: '23 3 * * 1']  # weekly, Monday 03:23 UTC (off-peak)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: x/primmel/sst }
      - uses: actions/checkout@v4
        with: { repository: primmel/primmel-ts, path: x/primmel/primmel-ts }
      - uses: actions/checkout@v4
        with: { repository: oimlsmart/sst, path: x/oimlsmart/sst-instruments }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: x/primmel/sst/package-lock.json }
      - run: npm ci
        working-directory: x/primmel/sst
      - run: npm run typecheck
        working-directory: x/primmel/sst

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with: { path: x/primmel/sst }
      - uses: actions/checkout@v4
        with: { repository: primmel/primmel-ts, path: x/primmel/primmel-ts }
      - uses: actions/checkout@v4
        with: { repository: oimlsmart/sst, path: x/oimlsmart/sst-instruments }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: x/primmel/sst/package-lock.json
      - run: npm ci
        working-directory: x/primmel/sst
      - run: npm ci
        working-directory: x/oimlsmart/sst-instruments
      # The library's position is DECLARED (never probed): the package
      # tests resolve the kinds + instances through SST_LIBRARY_PATH.
      - run: npm test
        working-directory: x/primmel/sst
        env:
          SST_LIBRARY_PATH: ${{ github.workspace }}/x/oimlsmart/sst-instruments

  bench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: x/primmel/sst }
      - uses: actions/checkout@v4
        with: { repository: primmel/primmel-ts, path: x/primmel/primmel-ts }
      - uses: actions/checkout@v4
        with: { repository: oimlsmart/sst, path: x/oimlsmart/sst-instruments }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: x/primmel/sst/package-lock.json }
      - run: npm ci
        working-directory: x/primmel/sst
      - run: npm ci
        working-directory: x/oimlsmart/sst-instruments
      - run: npm run build --workspace @primmel/sst-bench
        working-directory: x/primmel/sst
      - run: test -f packages/shell/sst-bench/dist/index.html
        working-directory: x/primmel/sst
      - uses: actions/upload-artifact@v4
        with:
          name: bench-dist
          path: x/primmel/sst/packages/shell/sst-bench/dist
          retention-days: 7

  instrument-boot:
    # The real user experience, proven in CI: the sst-runtime CLI boots an
    # instrument instance from the oimlsmart/sst checkout and serves all
    # surfaces — plus a scripted IOS-style console session.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: x/primmel/sst }
      - uses: actions/checkout@v4
        with: { repository: primmel/primmel-ts, path: x/primmel/primmel-ts }
      - uses: actions/checkout@v4
        with: { repository: oimlsmart/sst, path: x/oimlsmart/sst-instruments }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: x/primmel/sst/package-lock.json }
      - run: npm ci
        working-directory: x/primmel/sst
      - run: npm ci
        working-directory: x/oimlsmart/sst-instruments
      - name: boot acme-lc500 via the sst-runtime CLI and exercise it
        working-directory: x/primmel/sst
        run: |
          npx tsx packages/runtime/sst-runtime/src/bin.ts run ../../oimlsmart/sst-instruments/packages/instances/acme-lc500 5290 &
          SIM_PID=$!
          trap 'kill $SIM_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5290/ 2>/dev/null || true)
            [ "$code" = "200" ] && break; sleep 1
          done
          [ "$code" = "200" ] || { echo "sim did not boot"; exit 1; }
          curl -s -X POST http://localhost:5290/world -H 'content-type: application/json' \
            -d '{"query":"mutation { placeLoad(massKg: 40) { groundTruth { appliedLoadKg } } }"}' | grep -q '"appliedLoadKg":40'
          curl -s -X POST http://localhost:5290/twin -H 'content-type: application/json' \
            -d '{"query":"{ indication { value unit } }"}' | grep -q '"unit":"kg"'
          curl -s http://localhost:5290/world -H 'accept: text/html' | grep -qi graphiql
          curl -s http://localhost:5290/twin -H 'accept: text/html' | grep -qi graphiql
          # The load application device (R 60-2, 2.7.2): the machine ramps
          # to the nominal 40 kg; the realized load lands within its class
          # envelope (±(class + 4×repeatability) ≈ ±0.052 kg at 40 kg).
          curl -s -X POST http://localhost:5290/world -H 'content-type: application/json' \
            -d '{"query":"mutation { ladApply(loadKg: 40, rateKgPerS: 40) { clock } }"}' > /dev/null
          curl -s -X POST http://localhost:5290/world -H 'content-type: application/json' \
            -d '{"query":"mutation { advanceTime(seconds: 5) { groundTruth { appliedLoadKg lad { phase } } } }"}' > /tmp/lad.json
          grep -q '"phase":"holding"' /tmp/lad.json
          node -e "const g=require('/tmp/lad.json').data.advanceTime.groundTruth; if (Math.abs(g.appliedLoadKg-40) > 0.1) { console.error('realized load out of envelope:', g.appliedLoadKg); process.exit(1) }"
          echo "standalone boot + all surfaces OK"
      - name: drive a scripted console session
        working-directory: x/primmel/sst
        run: |
          printf 'enable\nplace load 40\nshow ground-truth\nadvance 5m\nshow clock\nexit\n' \
            | npx tsx packages/runtime/sst-runtime/src/bin.ts run ../../oimlsmart/sst-instruments/packages/instances/acme-lc500 5291 --console > /tmp/console.out 2>&1 &
          CON_PID=$!
          for i in $(seq 1 20); do grep -q '"clock": 300' /tmp/console.out 2>/dev/null && break; sleep 1; done
          kill $CON_PID 2>/dev/null || true
          grep -q '"appliedLoadKg": 40' /tmp/console.out
          grep -q '"clock": 300' /tmp/console.out
          echo "console session OK"
